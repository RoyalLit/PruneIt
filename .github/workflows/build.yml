name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Lint design tokens
        run: node scripts/lint-design-tokens.mjs

      - name: Check translations
        run: python3 scripts/check-localization.py

      # Phase 5: Ad-hoc signing — no Developer ID or notarization required.
      # CODE_SIGN_IDENTITY="" and CODE_SIGNING_ALLOWED=NO are the correct flags
      # for unsigned builds. This is intentional; see README "Installing PruneIt".
      - name: Build (unsigned)
        run: |
          xcodebuild clean build \
            -project PruneIt.xcodeproj \
            -scheme PruneIt \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          mkdir -p TestResults
          xcodebuild test \
            -project PruneIt.xcodeproj \
            -scheme PruneIt \
            -destination 'platform=macOS' \
            -skip-testing:PruneItTests/ProcessRunnerTests \
            -skip-testing:PruneItTests/FolderSizingConcurrencyTests \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run process stress tests
        timeout-minutes: 10
        run: |
          xcodebuild test \
            -project PruneIt.xcodeproj \
            -scheme PruneIt \
            -destination 'platform=macOS' \
            -only-testing:PruneItTests/ProcessRunnerTests \
            -resultBundlePath TestResults/ProcessStressTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run folder sizing stress tests
        timeout-minutes: 10
        run: |
          xcodebuild test \
            -project PruneIt.xcodeproj \
            -scheme PruneIt \
            -destination 'platform=macOS' \
            -only-testing:PruneItTests/FolderSizingConcurrencyTests \
            -resultBundlePath TestResults/FolderSizingStressTests.xcresult \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
